name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: reaper99/recipya-rs
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/recipya-rs

jobs:
  commits:
    name: Commits
    runs-on: ubuntu-latest
    outputs:
      numCommits: ${{ steps.numCommits.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get new commits
        id: numCommits
        run: echo "commits=$(git log --oneline --since '24 hours ago' | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

  binaries:
    timeout-minutes: 120
    needs: commits
    runs-on: ${{ matrix.os }}
    if: ${{ needs.commits.outputs.numCommits > 0 }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds (use Docker)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: recipya-nightly-x86_64-unknown-linux-musl
            use_docker: true
            platform: linux/amd64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: recipya-nightly-x86_64-unknown-linux-gnu
            use_docker: true
            platform: linux/amd64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: recipya-nightly-aarch64-unknown-linux-gnu
            use_docker: true
            platform: linux/arm64

          #- os: ubuntu-latest
          #  target: armv7-unknown-linux-gnueabihf
          #  artifact: recipya-nightly-armv7-unknown-linux-gnueabihf

          # macOS builds (use native)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: recipya-nightly-aarch64-apple-darwin
            use_docker: false

          # Windows builds (use native)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: recipya-nightly-x86_64-pc-windows-msvc
            use_docker: false

          #- os: windows-latest
          #  target: x86_64-pc-windows-gnu
          #  artifact: recipya-nightly-x86_64-pc-windows-gnu.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU
        if: matrix.use_docker && !(runner.arch == 'ARM64' && matrix.platform == 'linux/arm64')
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        if: matrix.use_docker
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker
        if: matrix.use_docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          target: builder
          outputs: type=local,dest=./output
          cache-from: type=gha,scope=binaries-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=binaries-${{ matrix.target }}

      - name: Install Rust
        if: ${{ !matrix.use_docker }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        if: ${{ !matrix.use_docker }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Postgres (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib" >> $GITHUB_ENV
          echo "PQ_INCLUDE_DIR=$(brew --prefix libpq)/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install Postgres (Windows)
        if: runner.os == 'Windows'
        uses: ikalnytskyi/action-setup-postgres@v8

      - name: Set PostgreSQL env (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $pgPath = Get-ChildItem "C:\Program Files\PostgreSQL" |
                    Sort-Object Name -Descending |
                    Select-Object -First 1 -ExpandProperty FullName
          echo "PQ_LIB_DIR=$pgPath\lib" >> $env:GITHUB_ENV
          echo "PQ_INCLUDE_DIR=$pgPath\include" >> $env:GITHUB_ENV
          echo "$pgPath\bin" >> $env:GITHUB_PATH

      - name: Build Binary
        if: ${{ !matrix.use_docker }}
        run: cargo build -r --target ${{ matrix.target }}

      - name: Package Binary
        shell: bash
        run: |
          BASE_DIR="staging-directory"
          mkdir -p "$BASE_DIR"

          BINARY_NAME="recipya-cli"
          ARTIFACT_NAME="${{ matrix.artifact }}"
          TARGET_DIR="${BASE_DIR}/${ARTIFACT_NAME}"
          mkdir -p "$TARGET_DIR"

          # Copy files
          if [ "${{ matrix.use_docker }}" = "true" ]; then
            cp ./output/usr/local/bin/${BINARY_NAME} "${TARGET_DIR}/${BINARY_NAME}"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${BINARY_NAME}.exe" "${TARGET_DIR}/${BINARY_NAME}.exe"
            PG_BIN="/c/Program Files/PostgreSQL/18/bin"
            cp "$PG_BIN"/libpq.dll "${TARGET_DIR}/"
            cp "$PG_BIN"/libcrypto-*.dll "${TARGET_DIR}/"
            cp "$PG_BIN"/libssl-*.dll "${TARGET_DIR}/"
            cp "$PG_BIN"/libintl-*.dll "${TARGET_DIR}/"
            cp "$PG_BIN"/libiconv-*.dll "${TARGET_DIR}/"
          else
            cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${TARGET_DIR}/${BINARY_NAME}"
          fi

          cp ./deploy/.env.example "${TARGET_DIR}/.env"
          cp LICENSE "${TARGET_DIR}/LICENSE"

          # Generate checksum
          cd "${TARGET_DIR}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            sha256sum "${BINARY_NAME}.exe" | awk '{ print $1 }' > "${BINARY_NAME}.sha256"
          else
            shasum -a 256 "${BINARY_NAME}" | awk '{ print $1 }' > "${BINARY_NAME}.sha256"
          fi
          cd -

          # Create zip
          cd "$BASE_DIR"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell Compress-Archive -Path "${ARTIFACT_NAME}" -DestinationPath "${ARTIFACT_NAME}.zip"
          else
            zip -r "${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}"
          fi
          cd -

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging-directory/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: binaries

    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: recipya-nightly-*

      - uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN  }}
          automatic_release_tag: nightly
          prerelease: false
          title: "Nightly Build"
          files: |
            downloads/recipya-nightly-x86_64-unknown-linux-musl/*
            downloads/recipya-nightly-x86_64-unknown-linux-gnu/*
            downloads/recipya-nightly-aarch64-unknown-linux-gnu/*
            downloads/recipya-nightly-aarch64-apple-darwin/*
            downloads/recipya-nightly-x86_64-pc-windows-msvc/*

  build-push-db:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: commits
    if: ${{ needs.commits.outputs.numCommits > 0 }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push database image
        id: build-db
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.db
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ env.REGISTRY_IMAGE }}-db:nightly
            ${{ env.GHCR_IMAGE }}-db:nightly
          push: true
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db

  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    needs: commits
    if: ${{ needs.commits.outputs.numCommits > 0 }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          tags: |
            ${{ env.REGISTRY_IMAGE }}:nightly
            ${{ env.GHCR_IMAGE }}:nightly
          push: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
