  # Problem is `COPY --from=build /usr/lib/${ARCH}-linux-gnu/[...]]* /usr/lib/${ARCH}-linux-gnu/`. 
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 480
#    needs: release

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v6 
        with: 
          context: .
          file: ./deploy/Dockerfile.qemu
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDKIT_STEP_LOG_MAX_SIZE=50000000
            BUILDKIT_STEP_LOG_MAX_SPEED=10000000
#          build-args: |
#            ARCH=aarch64
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          tags: |
            ${{ env.REGISTRY_IMAGE }}:nightly 
            ${{ env.GHCR_IMAGE }}:nightly
          push: true

