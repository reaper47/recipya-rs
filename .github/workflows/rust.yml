name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: stable

      - uses: ikalnytskyi/action-setup-postgres@v7
        with:
          username: postgres
          password: postgres
          database: recipya
          port: 5432
          postgres-version: "17"
          ssl: "false"
        id: postgres

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h postgres -U postgres; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 1
          done

      - name: Create additional databases
        run: |
          psql -h postgres -U postgres -c "CREATE DATABASE recipya_test;"
          psql -h postgres -U postgres -c "CREATE DATABASE recipya;"

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Test
        run: cargo test
