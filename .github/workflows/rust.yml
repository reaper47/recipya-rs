name: Rust
permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_PORT: "5432"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache cargo registry & bins
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: ikalnytskyi/action-setup-postgres@v7
        with:
          username: ${{ env.DB_USER }}
          password: ${{ env.DB_PASSWORD }}
          database: recipya_test
          port: ${{ env.DB_PORT }}
          postgres-version: "17"
          ssl: "false"
        id: postgres

      - name: Create database secrets
        run: |
          printf '%s' "$DB_USER" > "$RUNNER_TEMP/db_user"
          printf '%s' "$DB_PASSWORD" > "$RUNNER_TEMP/db_password"
          {
            echo "DATABASE_USER_FILE=$RUNNER_TEMP/db_user"
            echo "DATABASE_PASSWORD_FILE=$RUNNER_TEMP/db_password"
            echo "DATABASE_HOST=localhost"
            echo "DATABASE_PORT=$DB_PORT"
          } >> "$GITHUB_ENV"

      - name: Install diesel_cli
        run: |
          command -v diesel || \
          cargo install diesel_cli --no-default-features --features postgres

      - name: Run migrations
        run: diesel migration run
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Clippy (all targets)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test dev build
        uses: nick-fields/retry@v2
        env:
          RECIPYA_BASE_URL: "http://localhost:8078"
          RECIPYA_AUTOLOGIN: "false"
          RECIPYA_IS_DEMO: "false"
          RECIPYA_ALLOW_SIGNUPS: "false"
          SMTP_FROM_EMAIL: "example@gmail.com"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_USERNAME: "example@gmail.com"
          SMTP_PASSWORD: "abcd abcd bcd abcd"
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: cargo test --locked

      - name: Test release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: nick-fields/retry@v2
        env:
          RECIPYA_BASE_URL: "http://localhost:8078"
          RECIPYA_AUTOLOGIN: "false"
          RECIPYA_IS_DEMO: "false"
          RECIPYA_ALLOW_SIGNUPS: "false"
          SMTP_FROM_EMAIL: "example@gmail.com"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_USERNAME: "example@gmail.com"
          SMTP_PASSWORD: "abcd abcd bcd abcd"
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: cargo test --release --locked

      - name: sccache stats
        run: ${SCCACHE_PATH} --show-stats
