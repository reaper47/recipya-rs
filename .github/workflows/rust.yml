name: Rust
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - uses: ikalnytskyi/action-setup-postgres@v7
        with:
          username: postgres
          password: postgres
          database: recipya_test
          port: 5432
          postgres-version: "17"
          ssl: "false"
        id: postgres

      - name: Check for diesel CLI
        id: diesel_check
        run: |
          if command -v diesel >/dev/null 2>&1; then
            echo "Diesel already installed."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Diesel not installed."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install diesel_cli
        if: steps.diesel_check.outputs.exists == 'false'
        run: cargo install diesel_cli --no-default-features --features postgres

      - run: diesel migration run
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Test
        run: cargo test --locked
        env:
          RECIPYA_DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
          RECIPYA_BASE_URL: "http://localhost:8078"
          RECIPYA_IS_AUTOLOGIN: "false"
          RECIPYA_IS_DEMO: "false"
          RECIPYA_IS_NO_SIGNUPS: "false"
          RECIPYA_EMAIL_ADMIN: "example@gmail.com"
          RECIPYA_EMAIL_SMTP_HOST: "smtp.gmail.com"
          RECIPYA_EMAIL_SMTP_USERNAME: "example@gmail.com"
          RECIPYA_EMAIL_SMTP_PASSWORD: "abcd abcd bcd abcd"
          RECIPYA_AUTH_PASSWORD_KEY: "CKUGFOD9_2Qf6Pn3ZFRYgPYb8ht4vKqEG9PGMXTB7497bT0367DjoaD6ydFnEVaIRda0kKeBZVCT5Hb62m2sCA"
          RECIPYA_AUTH_TOKEN_KEY: "MN2z8mZgRymm0iojkVm1zkhnAXgXyhRdl6R2ODWST8LOIGS1ImV6sUvEDUncc0izt9xCzju2sGcEdGfSj23B0w"
          RECIPYA_AUTH_TOKEN_DURATION_SEC: "1800"
