name: Rust

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy

      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: taiki-e/install-action@nextest

      - uses: ikalnytskyi/action-setup-postgres@v7
        with:
          username: postgres
          password: postgres
          database: recipya_test
          port: 5432
          postgres-version: "17"
          ssl: "false"
        id: postgres

      - name: Check for diesel CLI
        id: diesel_check
        run: |
          if command -v diesel >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install diesel_cli
        if: steps.diesel_check.outputs.exists == 'false'
        run: cargo install diesel_cli --no-default-features --features postgres

      - run: diesel migration run
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Clippy production code
        run: cargo clippy
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

      - name: Clippy tests
        run: cargo clippy --tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"

      - name: Test
        run: cargo nextest run
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
          RECIPYA_BASE_URL: "http://localhost:8078"
          RECIPYA_IS_AUTOLOGIN: "false"
          RECIPYA_IS_DEMO: "false"
          RECIPYA_IS_ALLOW_SIGNUPS: "false"
          SMTP_FROM_EMAIL: "example@gmail.com"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_USERNAME: "example@gmail.com"
          SMTP_PASSWORD: "abcd abcd bcd abcd"

      - name: Run sccache stat for check
        shell: bash
        run: ${SCCACHE_PATH} --show-stats
