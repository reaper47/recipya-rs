services:
  recipya-app:
    container_name: recipya
    image: reaper99/recipya-rs:nightly
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "8078:8078"
    volumes:
      - recipya-data:/home/recipya/.local/share/Recipya
    depends_on:
      recipya-db:
        condition: service_healthy
    secrets:
      - db_password
      - db_user

  recipya-db:
    container_name: recipya-rs-db
    image: reaper99/recipya-rs-db:nightly
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipya
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - recipya-rs-db:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/db_user)\" -d recipya"]
      interval: 3s
      timeout: 5s
      retries: 10
    secrets:
      - db_password
      - db_user

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt

volumes:
  recipya-rs-db:
  recipya-data:
