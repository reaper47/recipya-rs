services:
  app:
    build:
      context: ..
      dockerfile: ./.devcontainer/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_USER_FILE: /run/secrets/db_user
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      DATABASE_HOST: db
    ports:
      - "8078:8078"
    secrets:
      - db_password
      - db_user

  db:
    container_name: recipya-rs-devdb
    build:
      context: ..
      dockerfile: ./deploy/Dockerfile.db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: recipya
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipya"]
      interval: 5s
      timeout: 5s
      retries: 5
    secrets:
      - db_password
      - db_user

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt

volumes:
  postgres-data:
