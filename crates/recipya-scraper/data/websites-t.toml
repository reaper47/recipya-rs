# Recipe Website Registry - T
# This file defines all supported recipe websites for scraping.
#
# Fields:
#   name    = Name of the website
#   domain  = Website domain (without www.)
#   variant = Rust enum variant name
#   url     = Recipe index/listing page
#   test    = Sample recipe URLs for testing
#
# Optional fields (add when needed):
#   cuisine = Name of the cuisine (lebanese, korean, vegetarian, etc.)
#
[[website]]
name = "The Modern Proper"
domain = "themodernproper.com"
variant = "TheModernProper"
url = "https://www.themodernproper.com/"
test = "https://themodernproper.com/grilled-honey-mustard-chicken-with-peach-salad"
