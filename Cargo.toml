[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["reaper47"]
categories = ["web-programming"]
description = "A clean, simple and powerful recipe manager your whole family will enjoy."
edition = "2024"
homepage = "https://recipya.musicavis.ca"
keywords = ["food", "recipes", "recipe-manager"]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/reaper47/recipya-rs"
rust-version = "1.100.0"
version = "0.1.0"

[workspace.dependencies]
app = { path = "./crates/app" }
async-stream = "0.3.6"
async-trait = "0.1.92"
auth = { path = "./crates/auth", default-features = false }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-test = { version = "21.1.0" }
base64 = "0.23.1"
config = { path = "./crates/config" }
derive_more = { version = "2.1.1", features = ["from", "display"] }
diesel = { version = "2.4.0", features = ["postgres", "serde_json", "time", "uuid"] }
diesel-async = { version = "0.10.0", features = ["postgres", "bb8", "async-connection-wrapper"] }
diesel_full_text_search = "2.3.1"
divan = "0.1.21"
dotenvy = "0.15.7"
email = { path = "./crates/email" }
fluent-static = { version = "0.6.0", features = ["axum", "maud"] }
futures = "0.3.34"
futures-core = "0.3.34"
futures-util = "0.3.34"
indexmap = "2.14.2"
infer = "0.22.0"
integrations = { path = "./crates/integrations" }
itertools = "0.15.0"
jiff = "1.0.1"
jiff-diesel = { version = "1.0.0", features = ["postgres"] }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
krilla = "0.8.2"
l10n = { path = "./crates/l10n" }
lru = "0.19.0"
math = { path = "./crates/math" }
models = { path = "./crates/models" }
num-traits = "0.2.19"
nutrition = { path = "crates/nutrition" }
pretty_assertions = "1.4.1"
rand = "0.10.4"
recipya-scraper = { path = "crates/recipya-scraper" }
regex = "1.13.2"
repository = { path = "./crates/repository" }
reqwest = { version = "0.13.5", features = ["form", "json"] }
router = { path = "./crates/router" }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
schema-org = { path = "./crates/schema-org", default-features = false }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
support = { path = "./crates/support" }
templates = { path = "./crates/templates" }
test-db = { path = "./crates/test-db" }
test-fixtures = { path = "./crates/test-fixtures" }
test-harness = { path = "./crates/test-harness" }
tracing-test = "0.2.6"
tokio = { version = "1.54.1", features = ["fs", "process", "signal"] }
tower-cookies = "0.11.0"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.3", features = ["fast-rng", "serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }
whatlang = "0.16.4"
winnow = "1.0.5"
zeroize = { version = "1.9.2", features = ["zeroize_derive"] }
zip = "9.7.0"

[workspace.metadata.tasks]
check-sql = "diesel-guard check crates/repository/src/migrations/"
web-install-deps = "npm --prefix ./web/app install"
web-build = "npm --prefix ./web/app run build"

[profile.release]
lto = true
codegen-units = 1
