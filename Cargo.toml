[package]
name = "recipya-rs"
version = "0.1.0"
edition = "2024"
description = "A clean, simple and powerful recipe manager your whole family will enjoy."
readme = "README.md"
homepage = "https://recipya.musicavis.ca"
repository = "https://github.com/reaper47/recipya-rs"
license = "AGPL-3.0-or-later"
keywords = ["food", "recipes", "recipe-manager"]
categories = ["web-programming"]

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.88"
axum = { version = "0.8.4", features = ["multipart", "ws"] }
axum-htmx = "0.7.0"
base64 = "0.22.1"
clap = { version = "4.5.38", features = ["derive"] }
cooklang = "0.16.1"
derive_more = { version = "2.0.1", features = ["from", "display"] }
diesel = { version = "2.2.10", features = ["postgres", "chrono", "serde_json", "uuid"] }
diesel-async = { version = "0.5.2", features = ["postgres", "bb8", "async-connection-wrapper"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
directories = "6.0.0"
dotenvy = "0.15.7"
enum_dispatch = "0.3.13"
futures-util = "0.3.31"
hmac = "0.12.1"
humantime = "2.2.0"
image = "0.25.6"
infer = "0.19.0"
iso8601 = { version = "0.6.3", features = ["serde"] }
lazy-regex = "3.4.1"
lettre = { version = "0.11.16", default-features = false, features = ["smtp-transport", "pool", "rustls-tls", "hostname", "builder"] }
lru = "0.14.0"
maud = { version = "0.27.0", features = ["axum"] }
mime_guess = "2.0.5"
mrml = "5.0.0"
nom = "8.0.0"
paste = "1.0.15"
postgres_rustls = "0.1.2"
rand = "0.9.1"
recipemd = "0.2.0"
regex = "1.11.1"
reqwest = { version = "0.12.18", default-features = false, features = ["blocking", "charset", "http2", "macos-system-configuration", "rustls-tls"] }
rust-embed = { version = "8.7.2", features = ["axum-ex"] }
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde-xml-rs = "0.7.1"
sha2 = "0.10.9"
strum_macros = "0.27.1"
time = "0.3.41"
tokio = { version = "1.45.1", features = ["full"] }
tokio-cron-scheduler = "0.14.0"
tokio-postgres = { version = "0.7.13", features = ["with-serde_json-1", "with-time-0_3", "with-uuid-1"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["logging", "tls12", "ring"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.6.4", features = ["fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.17.0", features = ["fast-rng", "serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }
webp = "0.3.0"
whatlang = "0.16.4"
libpaprika = { version = "0.4.1", default-features = false }

[dev-dependencies]
axum-test = { version = "17.2.0", features = ["ws"] }
pretty_assertions = "1.4.1"
tower = "0.5.2"

[profile.release]
lto = true
codegen-units = 1

[target.'x86_64-unknown-linux-musl'.dependencies]
openssl = { version = "0.10.72", features = ["vendored"] }
pq-sys = { version = "0.7.1", features = ["bundled"] }

[target.'x86_64-unknown-linux-gnu'.dependencies]
openssl = { version = "0.10.72", features = ["vendored"] }
pq-sys = { version = "0.7.1", features = ["bundled"] }

[target.'aarch64-unknown-linux-gnu'.dependencies]
openssl = { version = "0.10.72", features = ["vendored"] }
pq-sys = { version = "0.7.1", features = ["bundled"] }

[package.metadata.tasks]
web-install-deps = "npm --prefix ./web/app install"
web-build = "npm --prefix ./web/app run build"
