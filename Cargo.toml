[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["reaper47"]
categories = ["web-programming"]
description = "A clean, simple and powerful recipe manager your whole family will enjoy."
edition = "2024"
homepage = "https://recipya.musicavis.ca"
keywords = ["food", "recipes", "recipe-manager"]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/reaper47/recipya-rs"
rust-version = "1.92.0"

[workspace.dependencies]
app = { path = "./crates/app" }
async-stream = "0.3.6"
async-trait = "0.1.89"
auth = { path = "./crates/auth", default-features = false }
axum = { version = "0.8.8", features = ["macros", "multipart", "ws"] }
axum-test = { version = "18.1.0", features = ["ws"] }
base64 = "0.22.1"
chrono = "0.4.43"
config = { path = "./crates/config" }
derive_more = { version = "2.0.1", features = ["from", "display"] }
diesel = { version = "2.3.5", features = ["postgres", "chrono", "serde_json", "time", "uuid"] }
diesel-async = { version = "0.7.4", features = ["postgres", "bb8", "async-connection-wrapper"] }
diesel_full_text_search = "2.3.0"
dotenvy = "0.15.7"
email = { path = "./crates/email" }
futures-core = "0.3.31"
futures-util = "0.3.31"
humantime = "2.3.0"
indexmap = "2.13.0"
infer = "0.19.0"
integrations = { path = "./crates/integrations" }
iso8601 = { version = "0.6.3", features = ["serde"] }
itertools = "0.14.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
lru = "0.16.3"
math = { path = "./crates/math" }
models = { path = "./crates/models" }
pretty_assertions = "1.4.1"
recipya-scraper = { path = "crates/recipya-scraper" }
regex = "1.12.2"
repository = { path = "./crates/repository" }
reqwest = { version = "0.13.1", features = ["blocking", "form", "json"] }
router = { path = "./crates/router" }
rustls = { version = "0.23.36", default-features = false, features = ["ring"] }
schema-org = { path = "./crates/schema-org", default-features = false }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.2"
support = { path = "./crates/support" }
templates = { path = "./crates/templates" }
testing = { path = "./crates/testing" }
time = { version = "0.3.47", features = ["serde"] }
tracing-test = "0.2.5"
tokio = { version = "1.49.0", features = ["full"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.20.0", features = ["fast-rng", "serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }
whatlang = "0.16.4"
winnow = "0.7.14"
zip = "7.2.0"

[workspace.metadata.tasks]
web-install-deps = "npm --prefix ./web/app install"
web-build = "npm --prefix ./web/app run build"

[profile.release]
lto = true
codegen-units = 1
